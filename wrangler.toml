name = "online-hokm"
main = "src/index.js"
compatibility_date = "2026-09-25"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDO" }
]

[exports.RoomDO]
type = "durable-object"
storage = "sqlite"

# Retire the orphaned MatchDO namespace (was provisioned but never exported in code)
[exports.MatchDO]
type = "durable-object"
state = "deleted"

[assets]
directory = "./public"
